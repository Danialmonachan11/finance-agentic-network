services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finance_agentic
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance_dev_only
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/ontology/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/finance_dev_only
    ports:
      - "7474:7474"   # browser UI
      - "7687:7687"   # bolt
    volumes:
      - neo4jdata:/data

volumes:
  pgdata:
  neo4jdata:
