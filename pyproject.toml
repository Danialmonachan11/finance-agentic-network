[project]
name = "finance-agentic-network"
version = "0.2.0"
description = "Agent that sits on a company's finance mailbox and answers the cross-company questions, deployed per pair of companies."
requires-python = ">=3.11,<3.13"
dependencies = [
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-openai>=0.2",
    "psycopg[binary]>=3.2",
    "neo4j>=5.24",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "pymupdf>=1.24",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "mcp[cli]>=2.1",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.140",
    "alembic>=1.13",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[tool.uv]
# The lock file is the source of truth for CI and any other machine.
package = false

[tool.ruff]
line-length = 120
target-version = "py311"
